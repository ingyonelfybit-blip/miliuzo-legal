<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal — Miliuzo</title>
<meta name="description" content="Legal documents for Miliuzo: privacy policy and terms.">
<style>
  :root{--green:#15803D;--green-dark:#0f5f2d;--ink:#111827;--muted:#6B7280;--bg:#F7F8F7;--card:#fff;--line:#E5E7EB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:#374151;line-height:1.65;-webkit-font-smoothing:antialiased}
  .hero{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
        padding:56px 20px 52px;text-align:center}
  .brand{font-size:13px;letter-spacing:2px;font-weight:700;opacity:.85;text-transform:uppercase}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:10px}
  .wrap{max-width:720px;margin:-28px auto 64px;padding:0 16px}
  .card{background:var(--card);border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
  a.doc{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
        border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);
        font-weight:600;margin-bottom:12px}
  a.doc:hover{border-color:var(--green)}
  a.doc span{color:var(--green)}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
</style>
</head>
<body>
  <div class="hero">
    <div class="brand">Miliuzo</div>
    <h1>Legal</h1>
  </div>
  <div class="wrap">
    <div class="card">
      <a class="doc" href="privacy.html">Privacy Policy <span>&rarr;</span></a>
    </div>
    <footer>© 2026 Miliuzo. All rights reserved.</footer>
  </div>
</body>
</html>
